name: F' Style & Format Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  format-check:
    name: Run F' Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up throwaway F' CI project
        uses: ./.github/actions/setup-fprime-ci-project

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install F' Tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Format Check
        run: |
          # Checks files against F' style rules using fprime-util
          fprime-util format --check